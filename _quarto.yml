project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - resources.qmd
    - about.qmd
    - notebooks/**/*.qmd

website:
  title: "The Pharmacometrics Podcast"
  favicon: images/favicon.svg
  description: "Technical Companion — educational notebooks, mathematics, and reproducible code for pharmacometrics."
  site-url: https://aelmokadem.github.io/pharmacometrics-podcast/
  repo-url: https://github.com/aelmokadem/pharmacometrics-podcast
  search: true
  navbar:
    title: "The Pharmacometrics Podcast"
    left:
      - href: index.qmd
        text: Home
      - href: resources.qmd
        text: Technical Resources
      - href: about.qmd
        text: About
    right:
      - href: https://aelmokadem.me/podcasts/pharmacometrics-podcast/
        text: Podcast
      - href: https://github.com/aelmokadem/pharmacometrics-podcast
        icon: github
        aria-label: GitHub repository
  page-footer:
    left: "The Pharmacometrics Podcast · Technical Companion"
    right:
      - text: Main podcast website
        href: https://aelmokadem.me/podcasts/pharmacometrics-podcast/
      - text: Spotify
        icon: spotify
        href: https://open.spotify.com/show/54G0iCxWVSVeMsulbSlyr5
      - text: YouTube
        icon: youtube
        href: https://youtube.com/@pharmacometricspodcast
      - text: Apple Podcasts
        icon: apple
        href: https://podcasts.apple.com/us/podcast/the-pharmacometrics-podcast/id6832096373

format:
  html:
    theme:
      light: [cosmo, styles/custom.scss]
      dark: [darkly, styles/custom.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    html-math-method: mathjax
    link-external-newwindow: false
    smooth-scroll: false
    lang: en

execute:
  freeze: auto
  echo: true
  error: false
